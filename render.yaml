# Render Blueprint: бэкенд NestJS. Render → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: teamfinder-api
    runtime: node
    plan: free
    # Рядом с базой Supabase (eu-central-1): каждый запрос к базе — миллисекунды, а не пол-океана
    region: frankfurt
    rootDir: backend
    # --include=dev: nest CLI и TypeScript лежат в devDependencies, а при NODE_ENV=production npm их пропускает
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
